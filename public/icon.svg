<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" />

  <!-- Dual meal prep bowls / Flame icon stylized as 'D' -->
  <g transform="translate(116, 106)">
    <!-- Main stylized 'D' for DuoCal -->
    <path d="M40 40 H140 C210 40 260 90 260 150 C260 210 210 260 140 260 H40 Z" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M40 40 V260" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
    <!-- Glowing internal spark / leaf -->
    <circle cx="140" cy="150" r="32" fill="url(#glow)" stroke="#ffffff" stroke-width="8" />
  </g>
</svg>
